name: Deploy Crypto Dashboard Pages

on:
  push:
    branches:
      - main
    paths:
      - "dashboard/crypto-pdca/**"
      - ".github/workflows/deploy-crypto-dashboard-pages.yml"
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: crypto-dashboard-pages
  cancel-in-progress: true

jobs:
  deploy:
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Configure Pages
        uses: actions/configure-pages@v5

      - name: Upload dashboard artifact
        uses: actions/upload-pages-artifact@v3
        with:
          path: dashboard/crypto-pdca

      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4
